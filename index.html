<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Aplikasi Presensi Sholat Wajah</title>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 15px; text-align: center; }
    .card { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .tab-menu { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-menu button { flex: 1; padding: 10px; font-weight: bold; border: none; background: #e0e0e0; border-radius: 6px; cursor: pointer; }
    .tab-menu button.active { background: #007bff; color: white; }
    .video-container { position: relative; width: 100%; max-width: 480px; margin: 10px auto; background: #000; border-radius: 8px; overflow: hidden; min-height: 280px; }
    video { width: 100%; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .form-group { text-align: left; margin: 10px 0; }
    .form-group label { font-size: 14px; font-weight: bold; }
    .form-group input, .form-group select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #status { margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; background: #f8f9fa; }
    .status-success { background: #d4edda !important; color: #155724 !important; }
    .status-error { background: #f8d7da !important; color: #721c24 !important; }
    .status-warning { background: #fff3cd !important; color: #856404 !important; }
  </style>
</head>
<body>

<div class="card">
  <h2>Presensi Sholat Anak</h2>

  <div class="tab-menu">
    <button id="btnPresensi" class="active" onclick="gantiMode('presensi')">Mode Presensi</button>
    <button id="btnDaftar" onclick="gantiMode('daftar')">Perekaman Wajah</button>
  </div>

  <div class="video-container" id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
  </div>

  <div id="panelPresensi">
    <div class="form-group">
      <label for="jenisSholat">Pilih Kegiatan / Sholat:</label>
      <select id="jenisSholat">
        <option value="Subuh">Subuh</option>
        <option value="Dhuha">Dhuha</option>
        <option value="Dzuhur">Dzuhur</option>
        <option value="Jum'atan">Jum'atan</option>
        <option value="Ashar">Ashar</option>
        <option value="Maghrib" selected>Maghrib</option>
        <option value="Isya">Isya</option>
        <option value="Istighozah">Istighozah</option>
        <option value="Idul Adha">Idul Adha</option>
      </select>
    </div>
  </div>

  <div id="panelDaftar" style="display:none;">
    <div class="form-group">
      <label for="regId">ID Anak:</label>
      <input type="text" id="regId" placeholder="Contoh: A001">
    </div>
    <div class="form-group">
      <label for="regNama">Nama Anak:</label>
      <input type="text" id="regNama" placeholder="Contoh: Ahmad">
    </div>
    <button class="btn-submit" onclick="rekamWajah()">Rekam Wajah Anak</button>
  </div>

  <div id="status">Mengunduh Model AI Pemindai...</div>
</div>

<script>
  // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyspwEcsUFbIS9jq_2xL_XLo-0_fCExHy9Q86Ws8pWBs4Jp20HacC8ufwADhXCi4y1Z/exec";

  const video = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  let modeAktif = 'presensi';
  let faceMatcher = null;
  let cooldownMap = {};
  let isProcessing = false;

  function gantiMode(mode) {
    modeAktif = mode;
    document.getElementById('btnPresensi').className = mode === 'presensi' ? 'active' : '';
    document.getElementById('btnDaftar').className = mode === 'daftar' ? 'active' : '';
    document.getElementById('panelPresensi').style.display = mode === 'presensi' ? 'block' : 'none';
    document.getElementById('panelDaftar').style.display = mode === 'daftar' ? 'block' : 'none';

    if (mode === 'presensi') {
      muatDataMasterWajah();
    } else {
      tampilkanStatus("Posisikan wajah anak di depan kamera, isi ID & Nama, lalu klik Rekam.", "");
    }
  }

  function tampilkanStatus(pesan, jenis) {
    statusDiv.innerText = pesan;
    if (jenis === "success") statusDiv.className = "status-success";
    else if (jenis === "error") statusDiv.className = "status-error";
    else if (jenis === "warning") statusDiv.className = "status-warning";
    else statusDiv.className = "";
  }

  async function kirimKeGAS(data) {
    const response = await fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(data)
    });
    return await response.json();
  }

  async function muatDataMasterWajah() {
    tampilkanStatus("Mengambil data terdaftar dari spreadsheet...", "");
    try {
      const data = await kirimKeGAS({ action: "ambilMasterWajah" });
      if (!data || data.length === 0) {
        tampilkanStatus("Belum ada data anak terdaftar. Beralihlah ke tab 'Perekaman Wajah'.", "error");
        faceMatcher = null;
        return;
      }

      const labeledDescriptors = data.map(item => {
        const descriptorArray = new Float32Array(JSON.parse(item.descriptor));
        return new faceapi.LabeledFaceDescriptors(`${item.id}|${item.nama}`, [descriptorArray]);
      });

      faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
      tampilkanStatus("Sistem Siap! Silakan berdiri di depan kamera.", "success");
    } catch (e) {
      tampilkanStatus("Gagal mengambil data dari Google Sheets: " + e.message, "error");
    }
  }

  async function rekamWajah() {
    const id = document.getElementById('regId').value.trim();
    const nama = document.getElementById('regNama').value.trim();

    if (!id || !nama) {
      alert("ID dan Nama Anak wajib diisi!");
      return;
    }

    tampilkanStatus("Mendeteksi wajah...", "");

    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.2 }))
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!detection) {
      tampilkanStatus("Wajah tidak terdeteksi! Pastikan cahaya terang dan wajah menghadap kamera.", "error");
      return;
    }

    tampilkanStatus("Menyimpan ke spreadsheet...", "");
    const descriptorArray = Array.from(detection.descriptor);
    const descriptorJson = JSON.stringify(descriptorArray);

    try {
      const res = await kirimKeGAS({
        action: "simpanMasterWajah",
        idAnak: id,
        namaAnak: nama,
        descriptorJson: descriptorJson
      });

      if (res.status === "success") {
        tampilkanStatus(res.message, "success");
        document.getElementById('regId').value = "";
        document.getElementById('regNama').value = "";
      } else {
        tampilkanStatus(res.message, "error");
      }
    } catch (e) {
      tampilkanStatus("Gagal menyimpan: " + e.message, "error");
    }
  }

  async function init() {
    try {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);

      tampilkanStatus("Menyiapkan Kamera...", "");

      // KODE PERBAIKAN: Menggunakan ideal: "environment" dengan fallback aman
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: { ideal: "environment" } } 
        });
      } catch (errKameraBelakang) {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      }

      video.srcObject = stream;

      video.onloadedmetadata = () => {
        muatDataMasterWajah();
        mulaiPemindaianLoop();
      };
    } catch (err) {
      tampilkanStatus("Gagal Membuka Kamera: " + err.message, "error");
    }
  }

  function mulaiPemindaianLoop() {
    const container = document.getElementById('videoContainer');
    let canvas = document.querySelector('canvas');
    if (!canvas) {
      canvas = faceapi.createCanvasFromMedia(video);
      container.append(canvas);
    }

    setInterval(async () => {
      if (isProcessing) return;
      isProcessing = true;

      const displaySize = { width: video.clientWidth || 480, height: video.clientHeight || 360 };
      faceapi.matchDimensions(canvas, displaySize);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (modeAktif === 'presensi' && faceMatcher) {
        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.2 }))
          .withFaceLandmarks()
          .withFaceDescriptors();

        if (detections.length > 0) {
          const resizedDetections = faceapi.resizeResults(detections, displaySize);

          resizedDetections.forEach(detection => {
            const match = faceMatcher.findBestMatch(detection.descriptor);
            const box = detection.detection.box;

            const drawBox = new faceapi.draw.DrawBox(box, { label: match.toString() });
            drawBox.draw(canvas);

            if (match.label !== 'unknown') {
              const [idAnak, namaAnak] = match.label.split('|');
              prosesCatatPresensi(idAnak, namaAnak);
            } else {
              tampilkanStatus("Wajah terdeteksi, tetapi belum terdaftar (Unknown).", "warning");
            }
          });
        }
      }
      isProcessing = false;
    }, 250);
  }

  async function prosesCatatPresensi(idAnak, namaAnak) {
    const now = Date.now();
    if (cooldownMap[idAnak] && (now - cooldownMap[idAnak] < 15000)) return;

    cooldownMap[idAnak] = now;
    const jenisSholat = document.getElementById('jenisSholat').value;

    tampilkanStatus(`Mencatat data presensi: ${namaAnak}...`, "");

    try {
      const res = await kirimKeGAS({
        action: "simpanPresensi",
        idAnak: idAnak,
        namaAnak: namaAnak,
        jenisSholat: jenisSholat
      });

      if(res.status === "success") {
        tampilkanStatus(`BERHASIL! ${namaAnak} tercatat (${jenisSholat}).`, "success");
      }
    } catch (e) {
      console.error(e);
    }
  }

  window.onload = init;
</script>

</body>
</html>
