<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRESENSI SHLAT SPENSAKA - SMP NEGERI 1 KANDAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- HEADER UTAMA -->
  <header class="bg-emerald-700 text-white p-4 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-center space-x-3 text-center">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRESVnGGzgEIkf9q6nFxX3TJ2oCPb2g8wWhobdhB6didA&s" 
           alt="Logo Sekolah" class="w-12 h-12 rounded-full bg-white p-1 object-contain shadow">
      <div class="text-left">
        <h1 class="font-bold text-base leading-tight">PRESENSI SHOLAT SPENSAKA</h1>
        <p class="text-xs text-emerald-200">SMP NEGERI 1 KANDAT</p>
      </div>
    </div>
  </header>

  <!-- CONTAINER UTAMA -->
  <main class="max-w-md mx-auto p-4">

    <!-- 1. HALAMAN LOGIN -->
    <div id="loginView" class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
      <div class="text-center space-y-1">
        <h2 class="text-lg font-bold text-emerald-800">Masuk Akun Presensi</h2>
        <p class="text-xs text-slate-500">Gunakan ID Anak / NISN dan Password Anda</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ID Anak / NISN</label>
          <input type="text" id="loginUsername" required placeholder="Contoh: a1" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
        </div>
        <button type="submit" id="btnLogin" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk Sekarang
        </button>
      </form>
    </div>

    <!-- 2. DASHBOARD SETELAH LOGIN -->
    <div id="dashboardView" class="hidden space-y-4">
      
      <!-- NAVIGASI USER -->
      <div class="bg-white p-3.5 rounded-xl border flex items-center justify-between text-xs shadow-sm">
        <div>
          <p class="text-slate-400">Pengguna Login:</p>
          <p id="userNameLabel" class="font-bold text-emerald-800 text-sm">-</p>
          <span id="userRoleBadge" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-semibold">Siswa</span>
        </div>
        <button onclick="handleLogout()" class="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg font-semibold border border-red-200">
          <i class="fa-solid fa-power-off mr-1"></i> Keluar
        </button>
      </div>

      <!-- NAVIGASI TAB -->
      <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden border">
        <button id="tabBtnPresensi" onclick="switchTab('presensi')" 
                class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50">
          <i class="fa-solid fa-camera mr-1"></i> Presensi Sholat
        </button>
        <button id="tabBtnRekap" onclick="switchTab('rekap')" 
                class="flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600">
          <i class="fa-solid fa-list-check mr-1"></i> Rekap Presensi
        </button>
      </div>

      <!-- CONTENT TAB 1: KAMERA PRESENSI -->
      <div id="tabContentPresensi" class="bg-white p-4 rounded-b-xl border border-t-0 space-y-4 shadow-sm">
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Kegiatan / Sholat</label>
          <select id="jenisSholat" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Maghrib">Maghrib</option>
            <option value="Isya">Isya</option>
            <option value="Subuh">Subuh</option>
            <option value="Dhuha">Dhuha</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Jumat">Jumat</option>
            <option value="Istighozah">Istighozah</option>
          </select>
        </div>

        <!-- CAMERA TAMPILAN -->
        <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-video flex items-center justify-center border">
          <video id="webcam" autoplay playsinline class="w-full h-full object-cover"></video>
          <div class="absolute bottom-2 left-2 bg-black/60 text-white px-2 py-0.5 rounded text-[10px]" id="cameraStatus">
            Kamera Aktif
          </div>
        </div>

        <button onclick="submitPresensi()" id="btnSubmitPresensi" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl text-sm transition">
          <i class="fa-solid fa-check-circle mr-1.5"></i> Simpan Presensi Sholat
        </button>
      </div>

      <!-- CONTENT TAB 2: REKAP PRESENSI -->
      <div id="tabContentRekap" class="hidden bg-white p-4 rounded-b-xl border border-t-0 space-y-3 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm text-slate-700">Riwayat Presensi</h3>
          <button onclick="loadRekap()" class="text-xs text-emerald-600 hover:underline font-semibold">
            <i class="fa-solid fa-rotate mr-1"></i> Refresh
          </button>
        </div>

        <!-- TABEL DATA -->
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 border-b">
                <th class="p-2">Waktu</th>
                <th class="p-2">ID & Nama</th>
                <th class="p-2">Sholat</th>
              </tr>
            </thead>
            <tbody id="rekapTableBody">
              <tr>
                <td colspan="3" class="p-4 text-center text-slate-400">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <!-- SCRIPT LOGIC -->
  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyspwEcsUFbIS9jq_2xL_XLo-0_fCExHy9Q86Ws8pWBs4Jp20HacC8ufwADhXCi4y1Z/exec";

    let currentUser = null;
    let videoStream = null;

    // FUNGSI KHUSUS PENGIRIMAN DATA BEBAS ERROR CORS
    async function postToGoogleSheets(payload) {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // PROSES LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memeriksa...';

      try {
        const result = await postToGoogleSheets({ action: "login", username, password });

        if (result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('spensaka_user', JSON.stringify(currentUser));
          initDashboard();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke Google Sheets. Pastikan URL Apps Script sudah benar & Pengaturan Akses diatur ke 'Siapa Saja' (Anyone).");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk Sekarang';
      }
    }

    function initDashboard() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('userNameLabel').innerText = currentUser.nama + " (" + currentUser.username + ")";
      document.getElementById('userRoleBadge').innerText = currentUser.role;

      startCamera();
      loadRekap();
    }

    function handleLogout() {
      localStorage.removeItem('spensaka_user');
      currentUser = null;
      stopCamera();
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    // KAMERA
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "user" } }
        });
        document.getElementById('webcam').srcObject = videoStream;
      } catch (err) {
        document.getElementById('cameraStatus').innerText = "Kamera Tidak Aktif/Tidak Diizinkan";
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    }

    // SIMPAN PRESENSI
    async function submitPresensi() {
      if (!currentUser) return;

      const jenisSholat = document.getElementById('jenisSholat').value;
      const btn = document.getElementById('btnSubmitPresensi');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Menyimpan...';

      try {
        const result = await postToGoogleSheets({
          action: "simpan_presensi",
          user: currentUser,
          jenisSholat: jenisSholat
        });

        if (result.status === 'success') {
          alert("Alhamdulillah, " + result.message);
          loadRekap();
          switchTab('rekap');
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Gagal menyimpan presensi.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-check-circle mr-1.5"></i> Simpan Presensi Sholat';
      }
    }

    // AMBIL REKAP PRESENSI
    async function loadRekap() {
      if (!currentUser) return;
      const tbody = document.getElementById('rekapTableBody');
      tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat data...</td></tr>';

      try {
        const result = await postToGoogleSheets({ action: "get_rekap", user: currentUser });

        if (result.status === 'success' && result.data.length > 0) {
          tbody.innerHTML = result.data.map(item => `
            <tr class="border-b hover:bg-slate-50 text-[11px]">
              <td class="p-2 font-mono text-slate-500">${item.waktu}</td>
              <td class="p-2 font-semibold text-slate-700">${item.nama} <span class="text-slate-400">(${item.username})</span></td>
              <td class="p-2"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-medium border border-emerald-200">${item.jenisSholat}</span></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada riwayat presensi.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-400">Gagal mengambil data rekap.</td></tr>';
      }
    }

    // NAVIGASI TAB
    function switchTab(tab) {
      const btnP = document.getElementById('tabBtnPresensi');
      const btnR = document.getElementById('tabBtnRekap');
      const contentP = document.getElementById('tabContentPresensi');
      const contentR = document.getElementById('tabContentRekap');

      if (tab === 'presensi') {
        contentP.classList.remove('hidden');
        contentR.classList.add('hidden');
        btnP.className = "flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50";
        btnR.className = "flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600";
      } else {
        contentP.classList.add('hidden');
        contentR.classList.remove('hidden');
        btnR.className = "flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50";
        btnP.className = "flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600";
      }
    }

    // AUTO LOGIN JIKA SUDAH PERNAH LOGIN
    window.onload = () => {
      const savedUser = localStorage.getItem('spensaka_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initDashboard();
      }
    };
  </script>
</body>
</html>
