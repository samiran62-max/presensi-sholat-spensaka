<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRESENSI SHOLAT SPENSAKA SMP NEGERI 1 KANDAT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- LIBRARY PEMINDAI WAJAH OTOMATIS -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- HEADER UTAMA -->
  <header class="bg-emerald-700 text-white p-4 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-center space-x-3 text-center">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRESVnGGzgEIkf9q6nFxX3TJ2oCPb2g8wWhobdhB6didA&s" 
           alt="Logo Sekolah" class="w-12 h-12 rounded-full bg-white p-1 object-contain shadow">
      <div class="text-left">
        <h1 class="font-bold text-base leading-tight uppercase">PRESENSI SHOLAT SPENSAKA</h1>
        <p class="text-xs text-emerald-200 uppercase">SMP NEGERI 1 KANDAT</p>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4">

    <!-- 1. HALAMAN LOGIN PETUGAS -->
    <div id="loginView" class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
      <div class="text-center space-y-1">
        <div class="inline-block p-3 bg-emerald-50 rounded-full text-emerald-700 mb-1">
          <i class="fa-solid fa-camera-rotate text-2xl"></i>
        </div>
        <h2 class="text-lg font-bold text-emerald-800 uppercase">LOGIN SISTEM PRESENSI</h2>
        <p class="text-xs text-slate-500">Masukkan akun Petugas / Guru untuk membuka pemindai</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Username</label>
          <input type="text" id="loginUsername" required placeholder="Masukkan username" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" 
                 class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm outline-none">
        </div>
        <button type="submit" id="btnLogin" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">
          <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Buka Aplikasi
        </button>
      </form>
    </div>

    <!-- 2. DASHBOARD UTAMA -->
    <div id="dashboardView" class="hidden space-y-4">
      
      <!-- USER INFO HEADER -->
      <div class="bg-white p-3.5 rounded-xl border flex items-center justify-between text-xs shadow-sm">
        <div>
          <p class="text-slate-400">Pengguna Login:</p>
          <p id="userLabel" class="font-bold text-emerald-800 text-sm">-</p>
          <span id="roleBadge" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">Role</span>
        </div>
        <button onclick="handleLogout()" class="text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg font-semibold border border-red-200">
          <i class="fa-solid fa-power-off mr-1"></i> Keluar
        </button>
      </div>

      <!-- TAB MENU -->
      <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden border">
        <button id="tabBtnPresensi" onclick="switchTab('presensi')" 
                class="flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50">
          <i class="fa-solid fa-camera mr-1"></i> Presensi Otomatis
        </button>
        <button id="tabBtnWajah" onclick="switchTab('wajah')" 
                class="flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600">
          <i class="fa-solid fa-face-smile mr-1"></i> Rekam Wajah
        </button>
        <button id="tabBtnRekap" onclick="switchTab('rekap')" 
                class="flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600">
          <i class="fa-solid fa-list-check mr-1"></i> Rekap
        </button>
      </div>

      <!-- CONTENT TAB 1: MODE PRESENSI OTOMATIS -->
      <div id="tabContentPresensi" class="bg-white p-4 rounded-b-xl border border-t-0 space-y-4 shadow-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Kegiatan / Sholat:</label>
          <select id="jenisSholat" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="Maghrib">Maghrib</option>
            <option value="Isya">Isya</option>
            <option value="Subuh">Subuh</option>
            <option value="Dhuha">Dhuha</option>
            <option value="Dzuhur">Dzuhur</option>
            <option value="Ashar">Ashar</option>
            <option value="Jumat">Jumat</option>
            <option value="Istighozah">Istighozah</option>
          </select>
        </div>

        <!-- PILIHAN KAMERA (HANYA MUNCUL DI HP) -->
        <div id="cameraFacingContainer" class="hidden">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Pilih Kamera HP:</label>
          <select id="cameraFacingMode" onchange="changeCameraFacingMode()" class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
            <option value="user">Kamera Depan</option>
            <option value="environment">Kamera Belakang</option>
          </select>
        </div>

        <!-- TAMPILAN KAMERA PEMINDAI WAJAH -->
        <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-video flex items-center justify-center border shadow-inner">
          <video id="webcamPresensi" autoplay playsinline muted class="w-full h-full object-cover"></video>
          
          <div id="presensiStatus" class="absolute bottom-2 left-2 right-2 bg-black/60 text-white px-3 py-1.5 rounded-lg text-xs text-center transition-all">
            <i class="fa-solid fa-spinner fa-spin mr-1"></i> Memuat Model Wajah...
          </div>
        </div>
      </div>

      <!-- CONTENT TAB 2: PEREKAMAN WAJAH SISWA BARU -->
      <div id="tabContentWajah" class="hidden bg-white p-4 rounded-b-xl border border-t-0 space-y-4 shadow-sm">
        <div class="bg-amber-50 border border-amber-200 text-amber-800 p-2.5 rounded-lg text-xs">
          <i class="fa-solid fa-id-card mr-1"></i> Mode Pendaftaran Master Wajah Siswa Baru.
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">ID Anak Baru</label>
            <input type="text" id="idAnakWajah" placeholder="Contoh: a3" 
                   class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Anak Baru</label>
            <input type="text" id="namaAnakWajah" placeholder="Contoh: Budi" 
                   class="w-full px-3 py-2 border rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
        </div>

        <div class="relative bg-slate-900 rounded-xl overflow-hidden aspect-video flex items-center justify-center border">
          <video id="webcamWajah" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <div class="absolute bottom-2 left-2 bg-black/60 text-white px-2 py-0.5 rounded text-[10px]">
            Kamera Perekaman Wajah
          </div>
        </div>

        <button onclick="submitRekamWajah()" id="btnSubmitWajah" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow">
          <i class="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Data Master Wajah
        </button>
      </div>

      <!-- CONTENT TAB 3: REKAP PRESENSI -->
      <div id="tabContentRekap" class="hidden bg-white p-4 rounded-b-xl border border-t-0 space-y-3 shadow-sm">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm text-slate-700">Riwayat Presensi Siswa</h3>
          <button onclick="loadRekap()" class="text-xs text-emerald-600 hover:underline font-semibold">
            <i class="fa-solid fa-rotate mr-1"></i> Refresh Data
          </button>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 border-b">
                <th class="p-2">Waktu</th>
                <th class="p-2">ID & Nama</th>
                <th class="p-2">Sholat</th>
              </tr>
            </thead>
            <tbody id="rekapTableBody">
              <tr>
                <td colspan="3" class="p-4 text-center text-slate-400">Memuat data...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyspwEcsUFbIS9jq_2xL_XLo-0_fCExHy9Q86Ws8pWBs4Jp20HacC8ufwADhXCi4y1Z/exec";
    const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/";

    let currentUser = null;
    let videoStream = null;
    let faceMatcher = null;
    let isModelsLoaded = false;
    let presensiInterval = null;
    let isProcessingPresensi = false;
    let lastPresensiTime = {};
    let currentTab = 'presensi';

    // Deteksi jika perangkat adalah Smartphone (HP)
    const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    async function postToGoogleSheets(payload) {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    async function loadModels() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        isModelsLoaded = true;
      } catch(e) {
        console.error("Gagal load model AI:", e);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memeriksa...';

      try {
        const result = await postToGoogleSheets({ action: "login", username, password });

        if (result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('spensaka_app_user', JSON.stringify(currentUser));
          initDashboard();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Gagal terhubung ke Google Sheets. Pastikan Akses Apps Script diatur ke 'Siapa Saja' (Anyone).");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i> Buka Aplikasi';
      }
    }

    async function initDashboard() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('userLabel').innerText = currentUser.nama;
      document.getElementById('roleBadge').innerText = currentUser.role;

      // Tampilkan pilihan kamera jika membuka dari HP
      const cameraFacingContainer = document.getElementById('cameraFacingContainer');
      if (isMobile) {
        cameraFacingContainer.classList.remove('hidden');
      } else {
        cameraFacingContainer.classList.add('hidden');
      }

      const tabWajah = document.getElementById('tabBtnWajah');
      if (currentUser.role.toLowerCase() === 'petugas') {
        tabWajah.classList.add('hidden');
      } else {
        tabWajah.classList.remove('hidden');
      }

      if (!isModelsLoaded) await loadModels();
      await syncMasterWajah();
      switchTab('presensi');
      loadRekap();
    }

    function handleLogout() {
      localStorage.removeItem('spensaka_app_user');
      currentUser = null;
      stopCamera();
      if (presensiInterval) clearInterval(presensiInterval);
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
    }

    async function syncMasterWajah() {
      try {
        const result = await postToGoogleSheets({ action: "get_master_wajah" });
        if (result.status === 'success' && result.data.length > 0) {
          const masterDescriptors = result.data.map(item => {
            try {
              const vec = JSON.parse(item.vectorWajah);
              if (Array.isArray(vec) && vec.length === 128) {
                return new faceapi.LabeledFaceDescriptors(
                  `${item.idAnak}___${item.namaAnak}`,
                  [new Float32Array(vec)]
                );
              }
            } catch(e) {}
            return null;
          }).filter(x => x !== null);

          if (masterDescriptors.length > 0) {
            faceMatcher = new faceapi.FaceMatcher(masterDescriptors, 0.50);
          }
        }
      } catch(e) {
        console.error("Gagal sync master wajah:", e);
      }
    }

    async function startCamera(elementId) {
      stopCamera();

      // HP bisa pilih kamera depan ('user') / belakang ('environment'), Laptop/Tablet default 'user'
      let facingModeValue = 'user';
      if (isMobile) {
        const facingSelect = document.getElementById('cameraFacingMode');
        if (facingSelect) facingModeValue = facingSelect.value;
      }

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facingModeValue } }
        });
        document.getElementById(elementId).srcObject = videoStream;
      } catch (err) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
          document.getElementById(elementId).srcObject = videoStream;
        } catch(e) {
          console.log("Kamera tidak aktif/tidak tersedia.");
        }
      }
    }

    function changeCameraFacingMode() {
      if (currentTab === 'presensi') {
        startCamera('webcamPresensi').then(() => startAutoPresensiLoop());
      } else if (currentTab === 'wajah') {
        startCamera('webcamWajah');
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      if (presensiInterval) clearInterval(presensiInterval);
    }

    function startAutoPresensiLoop() {
      if (presensiInterval) clearInterval(presensiInterval);

      presensiInterval = setInterval(async () => {
        if (isProcessingPresensi || currentTab !== 'presensi') return;

        const video = document.getElementById('webcamPresensi');
        const statusDiv = document.getElementById('presensiStatus');

        if (!video || video.paused || video.ended || !isModelsLoaded) return;

        if (!faceMatcher) {
          statusDiv.className = "absolute bottom-2 left-2 right-2 bg-amber-600/90 text-white px-3 py-1.5 rounded-lg text-xs text-center";
          statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1"></i> Master Wajah kosong. Daftarkan di Rekam Wajah.`;
          return;
        }

        try {
          const detection = await faceapi.detectSingleFace(
            video, 
            new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })
          ).withFaceLandmarks().withFaceDescriptor();

          if (detection) {
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

            if (bestMatch.label !== 'unknown') {
              const [idAnak, namaAnak] = bestMatch.label.split('___');
              const now = Date.now();

              if (!lastPresensiTime[idAnak] || (now - lastPresensiTime[idAnak] > 10000)) {
                isProcessingPresensi = true;
                lastPresensiTime[idAnak] = now;

                statusDiv.className = "absolute bottom-2 left-2 right-2 bg-emerald-600/95 text-white px-3 py-1.5 rounded-lg text-xs font-bold text-center animate-pulse shadow";
                statusDiv.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Terdeteksi: ${namaAnak} (${idAnak}) - Menyimpan...`;

                const jenisSholat = document.getElementById('jenisSholat').value;
                const result = await postToGoogleSheets({
                  action: "simpan_presensi",
                  idAnak: idAnak,
                  namaAnak: namaAnak,
                  jenisSholat: jenisSholat
                });

                if (result.status === 'success') {
                  statusDiv.className = "absolute bottom-2 left-2 right-2 bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold text-center shadow";
                  statusDiv.innerHTML = `<i class="fa-solid fa-check-double mr-1"></i> Berhasil Presensi: ${namaAnak} (${idAnak})`;
                  loadRekap();
                }
                setTimeout(() => { isProcessingPresensi = false; }, 2000);
              } else {
                statusDiv.className = "absolute bottom-2 left-2 right-2 bg-blue-600/90 text-white px-3 py-1.5 rounded-lg text-xs font-bold text-center";
                statusDiv.innerHTML = `<i class="fa-solid fa-clock mr-1"></i> ${namaAnak} (${idAnak}) Sudah Presensi`;
              }
            } else {
              statusDiv.className = "absolute bottom-2 left-2 right-2 bg-black/60 text-white px-3 py-1.5 rounded-lg text-xs text-center";
              statusDiv.innerHTML = `<i class="fa-solid fa-face-rolling-eyes mr-1"></i> Wajah tidak terdaftar di MasterWajah`;
            }
          } else {
            statusDiv.className = "absolute bottom-2 left-2 right-2 bg-black/60 text-white px-3 py-1.5 rounded-lg text-xs text-center";
            statusDiv.innerHTML = `<i class="fa-solid fa-camera mr-1"></i> Posisikan wajah di depan kamera...`;
          }
        } catch (e) {
          console.error("Presensi loop error:", e);
        }
      }, 600);
    }

    async function submitRekamWajah() {
      const idAnak = document.getElementById('idAnakWajah').value.trim();
      const namaAnak = document.getElementById('namaAnakWajah').value.trim();
      const video = document.getElementById('webcamWajah');
      const btn = document.getElementById('btnSubmitWajah');

      if (!idAnak || !namaAnak) {
        alert("Harap isi ID Anak dan Nama Anak Baru terlebih dahulu!");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memindai Wajah...';

      try {
        const detection = await faceapi.detectSingleFace(
          video, 
          new faceapi.TinyFaceDetectorOptions()
        ).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
          alert("Wajah tidak terdeteksi! Pastikan wajah terlihat jelas di dalam kamera.");
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Data Master Wajah';
          return;
        }

        const vectorArray = Array.from(detection.descriptor);
        const vectorWajahStr = JSON.stringify(vectorArray);

        const result = await postToGoogleSheets({
          action: "simpan_wajah",
          idAnak: idAnak,
          namaAnak: namaAnak,
          vectorWajah: vectorWajahStr
        });

        if (result.status === 'success') {
          alert("Sukses! Master Wajah " + namaAnak + " berhasil direkam.");
          document.getElementById('idAnakWajah').value = '';
          document.getElementById('namaAnakWajah').value = '';
          await syncMasterWajah();
        } else {
          alert("Gagal: " + result.message);
        }
      } catch (err) {
        alert("Gagal merekam data wajah.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i> Simpan Data Master Wajah';
      }
    }

    async function loadRekap() {
      const tbody = document.getElementById('rekapTableBody');
      try {
        const result = await postToGoogleSheets({ action: "get_rekap" });

        if (result.status === 'success' && result.data.length > 0) {
          tbody.innerHTML = result.data.map(item => `
            <tr class="border-b hover:bg-slate-50 text-[11px]">
              <td class="p-2 font-mono text-slate-500">${item.waktu}</td>
              <td class="p-2 font-semibold text-slate-700">${item.namaAnak} <span class="text-slate-400">(${item.idAnak})</span></td>
              <td class="p-2"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-medium border border-emerald-200">${item.jenisSholat}</span></td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-slate-400">Belum ada data presensi.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="p-4 text-center text-red-400">Gagal mengambil rekap data.</td></tr>';
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const btnP = document.getElementById('tabBtnPresensi');
      const btnW = document.getElementById('tabBtnWajah');
      const btnR = document.getElementById('tabBtnRekap');
      
      const contentP = document.getElementById('tabContentPresensi');
      const contentW = document.getElementById('tabContentWajah');
      const contentR = document.getElementById('tabContentRekap');

      const activeClass = "flex-1 py-2.5 text-center text-xs font-bold border-b-2 border-emerald-600 text-emerald-700 bg-emerald-50";
      const inactiveClass = "flex-1 py-2.5 text-center text-xs font-bold text-slate-500 hover:text-emerald-600";

      contentP.classList.add('hidden');
      contentW.classList.add('hidden');
      contentR.classList.add('hidden');

      btnP.className = inactiveClass;
      btnW.className = inactiveClass;
      btnR.className = inactiveClass;

      if (tab === 'presensi') {
        contentP.classList.remove('hidden');
        btnP.className = activeClass;
        startCamera('webcamPresensi').then(() => startAutoPresensiLoop());
      } else if (tab === 'wajah') {
        contentW.classList.remove('hidden');
        btnW.className = activeClass;
        startCamera('webcamWajah');
      } else if (tab === 'rekap') {
        contentR.classList.remove('hidden');
        btnR.className = activeClass;
        stopCamera();
      }
    }

    window.onload = () => {
      const savedUser = localStorage.getItem('spensaka_app_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        initDashboard();
      }
    };
  </script>
</body>
</html>
